name: voice_speech_app
description: Pronunciation training app with Azure Speech Assessment and AI feedback.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  dio: ^5.4.0
  flutter_sound: ^9.2.13
  just_audio: ^0.9.36
  fl_chart: ^0.66.2
  flutter_secure_storage: ^9.0.0
  path_provider: ^2.1.2
  uuid: ^4.3.3
  intl: ^0.19.0
  permission_handler: ^11.3.0
  google_fonts: ^6.1.0
  go_router: ^13.1.0
  json_annotation: ^4.8.1
  equatable: ^2.0.5
  audio_waveforms: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  build_runner: ^2.4.8
  json_serializable: ^6.7.1
  riverpod_generator: ^2.3.9

flutter:
  uses-material-design: true
